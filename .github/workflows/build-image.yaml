name: Build audit image

# Builds the DeepAudit runner image (the full arsenal, baked from lib/arsenal.py) and pushes it
# to this repo's GitHub Container Registry. Rebuilt when the toolset changes and weekly, so
# nuclei templates and advisory data stay reasonably fresh without a manual step.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - lib/arsenal.py
      - .github/workflows/build-image.yaml
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — refresh templates/CVEs
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
