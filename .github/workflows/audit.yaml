name: Audit # Python-supervised entrypoint

on:
  workflow_dispatch:
    inputs:
      target:
        description: One authorized public HTTP(S) URL or host
        required: true
        type: string
      authorized:
        description: I have permission to audit this target
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  audit:
    if: ${{ inputs.authorized }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run supervised audit flow
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TARGET: ${{ inputs.target }}
          PYTHONUNBUFFERED: '1'
        run: python -m lib.run_audit --target "$TARGET"
      - name: Upload report bundle
        id: report
        if: ${{ always() && hashFiles(format('audits/audit-{0}/**', github.run_id)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: deepaudit-report-${{ github.run_id }}
          path: audits/audit-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
      - name: Publish audit summary
        if: ${{ always() }}
        env:
          TARGET: ${{ inputs.target }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          {
            echo '## DeepAudit report'
            echo
            echo "Target: \`$TARGET\`"
            echo
            if [ -n "$REPORT_URL" ]; then
              echo "[Download the report bundle (includes report.html)]($REPORT_URL)"
            else
              echo 'The audit did not produce a report bundle.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
