name: Collect tool evidence
on:
  workflow_call:
    inputs:
      tool: { required: true, type: string }
      target: { required: true, type: string }
      params: { required: true, type: string }
      task_id: { required: true, type: string }
      evidence: { required: false, type: string, default: '{}' }
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install WhatWeb
        if: ${{ inputs.tool == 'fingerprinter' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq whatweb
      - name: Install Nmap
        if: ${{ inputs.tool == 'nmap' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap
      - name: Collect bounded evidence
        env:
          TOOL: ${{ inputs.tool }}
          TARGET: ${{ inputs.target }}
          PARAMS: ${{ inputs.params }}
          TASK_ID: ${{ inputs.task_id }}
          EVIDENCE: ${{ inputs.evidence }}
        run: python -m lib.collect "$TOOL"
      - name: Return evidence (including scanner errors)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ inputs.task_id }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 7
