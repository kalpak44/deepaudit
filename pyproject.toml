[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepaudit-mvp"
version = "0.1.0"
description = "A scoped, tool-using DeepSeek audit agent with reproducible read-only checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
deepaudit = "deepaudit.cli:main"

[tool.setuptools.packages.find]
include = ["deepaudit*"]
